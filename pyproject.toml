[project]
name = "social-downloader"
version = "0.1.0"
description = "A FastAPI backend using yt-dlp to download and stream videos from YouTube, Instagram, and TikTok. For educational use only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.10.0",
    "fastapi>=0.116.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
    "yt-dlp>=2025.7.21",
]
